<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Glow Pattern -->
  <circle cx="200" cy="150" r="300" fill="#10b981" opacity="0.15" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="280" fill="#fbbf24" opacity="0.12" filter="blur(80px)" />

  <!-- Badge -->
  <rect x="100" y="90" width="220" height="42" rx="21" fill="#10b981" opacity="0.25" stroke="#34d399" stroke-width="1.5" />
  <text x="125" y="117" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1">⚡ 15-MIN EXPRESS</text>

  <!-- Main Headline -->
  <text x="100" y="210" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900">FreshMart</text>
  <text x="440" y="210" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900">Organic</text>

  <!-- Subtitle -->
  <text x="100" y="280" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">
    100% Farm-Fresh Fruits, Organic Vegetables, Dairy &amp; Daily Essentials.
  </text>
  <text x="100" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22">
    Delivered Cold &amp; Fast to Your Doorstep in Lahore &amp; Beyond.
  </text>

  <!-- Key Highlights Pills -->
  <rect x="100" y="390" width="240" height="52" rx="12" fill="#065f46" stroke="#059669" stroke-width="1.5" />
  <text x="130" y="423" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">🥬 100% Organic</text>

  <rect x="360" y="390" width="260" height="52" rx="12" fill="#065f46" stroke="#059669" stroke-width="1.5" />
  <text x="390" y="423" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">🛵 Express 15-Min</text>

  <rect x="640" y="390" width="270" height="52" rx="12" fill="#065f46" stroke="#059669" stroke-width="1.5" />
  <text x="670" y="423" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">🛡️ Safe &amp; Verified</text>

  <!-- Domain Tagline -->
  <text x="100" y="540" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">grocery-fawn-five.vercel.app</text>
</svg>
